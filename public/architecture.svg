<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/><stop offset="1" stop-color="#0f151c"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1c5"/><stop offset="1" stop-color="#4a9fd8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1040" height="620" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="46" fill="#e6edf3" font-size="24" font-weight="700">Chokepoint — Architecture</text>
  <text x="40" y="72" fill="#94a3b4" font-size="13">Least-privilege access control &amp; tamper-evident audit · OWASP Agentic AI ASI03</text>

  <!-- Client layer -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="250" height="120" rx="12" fill="#10171f" stroke="#1f2a36"/>
    <text x="60" y="130" fill="#e6edf3" font-size="15" font-weight="700">Clients</text>
    <text x="60" y="152" fill="#94a3b4" font-size="12">• Web dashboard (Next.js)</text>
    <text x="60" y="170" fill="#94a3b4" font-size="12">• PWA (installable)</text>
    <text x="60" y="188" fill="#94a3b4" font-size="12">• Capacitor → Android/PC</text>
  </g>

  <!-- Auth layer -->
  <g filter="url(#shadow)">
    <rect x="340" y="100" width="300" height="120" rx="12" fill="#10171f" stroke="#2a3745"/>
    <text x="360" y="130" fill="#e6edf3" font-size="15" font-weight="700">Session &amp; Access Control</text>
    <text x="360" y="152" fill="#4fd1c5" font-size="12">HttpOnly · SameSite=Strict cookie</text>
    <text x="360" y="170" fill="#94a3b4" font-size="12">HMAC-signed session token</text>
    <text x="360" y="188" fill="#94a3b4" font-size="12">RBAC · roles: viewer/auditor/operator/admin</text>
    <text x="360" y="206" fill="#94a3b4" font-size="12">Dual-control (two-person rule)</text>
  </g>

  <!-- Policy engine -->
  <g filter="url(#shadow)">
    <rect x="690" y="100" width="300" height="120" rx="12" fill="#10171f" stroke="#2a3745"/>
    <text x="710" y="130" fill="#e6edf3" font-size="15" font-weight="700">Policy Engine (authz.ts)</text>
    <text x="710" y="152" fill="#94a3b4" font-size="12">can(role, action)</text>
    <text x="710" y="170" fill="#94a3b4" font-size="12">requiresDualControl(action)</text>
    <text x="710" y="188" fill="#94a3b4" font-size="12">enforceDualControl(...)</text>
    <text x="710" y="206" fill="#94a3b4" font-size="12">Separation of duties</text>
  </g>

  <!-- Arrows client->auth->policy -->
  <line x1="290" y1="160" x2="340" y2="160" stroke="#38b2ac" stroke-width="2"/>
  <line x1="640" y1="160" x2="690" y2="160" stroke="#38b2ac" stroke-width="2"/>

  <!-- Bottom layer: ledger -->
  <g filter="url(#shadow)">
    <rect x="40" y="280" width="960" height="130" rx="12" fill="#0d1117" stroke="#1f2a36"/>
    <text x="60" y="312" fill="#e6edf3" font-size="15" font-weight="700">Tamper-Evident Audit Ledger</text>
    <text x="60" y="334" fill="#94a3b4" font-size="12">Append-only · hash-chained · HMAC-SHA256 signed · genesis-block anchored</text>
    <g font-size="11" font-family="JetBrains Mono, monospace">
      <rect x="60" y="350" width="200" height="40" rx="8" fill="#10171f" stroke="#2a3745"/>
      <text x="75" y="372" fill="#4fd1c5">H1 = SHA256(prev‖…)</text>
      <rect x="280" y="350" width="200" height="40" rx="8" fill="#10171f" stroke="#2a3745"/>
      <text x="295" y="372" fill="#4fd1c5">H2 = SHA256(H1‖…)</text>
      <rect x="500" y="350" width="200" height="40" rx="8" fill="#10171f" stroke="#2a3745"/>
      <text x="515" y="372" fill="#4fd1c5">H3 = SHA256(H2‖…)</text>
      <rect x="720" y="350" width="240" height="40" rx="8" fill="#10171f" stroke="#2a3745"/>
      <text x="735" y="372" fill="#4fd1c5">verify() re-runs whole chain</text>
    </g>
  </g>

  <!-- Anomaly engine -->
  <g filter="url(#shadow)">
    <rect x="40" y="450" width="460" height="130" rx="12" fill="#10171f" stroke="#2a3745"/>
    <text x="60" y="482" fill="#e6edf3" font-size="15" font-weight="700">Anomaly Detection (anomaly.ts)</text>
    <text x="60" y="504" fill="#94a3b4" font-size="12">Failed login → brute-force</text>
    <text x="60" y="522" fill="#94a3b4" font-size="12">After-hours privilege → out-of-policy</text>
    <text x="60" y="540" fill="#94a3b4" font-size="12">Unknown source → unregistered</text>
    <text x="60" y="558" fill="#94a3b4" font-size="12">Rapid escalation → privilege creep</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="540" y="450" width="460" height="130" rx="12" fill="#10171f" stroke="#2a3745"/>
    <text x="560" y="482" fill="#e6edf3" font-size="15" font-weight="700">Risk Scoring</text>
    <text x="560" y="504" fill="#94a3b4" font-size="12">Explainable: every score has reasons</text>
    <text x="560" y="522" fill="#94a3b4" font-size="12">Severity: LOW / MEDIUM / HIGH / CRITICAL</text>
    <text x="560" y="540" fill="#94a3b4" font-size="12">Risk index (0–100) on the dashboard</text>
    <text x="560" y="558" fill="#94a3b4" font-size="12">Alerts feed the console in real time</text>
  </g>

  <!-- Connections -->
  <line x1="520" y1="280" x2="520" y2="360" stroke="#2a3745" stroke-width="2"/>
  <line x1="270" y1="410" x2="270" y2="450" stroke="#38b2ac" stroke-width="2"/>
  <line x1="770" y1="410" x2="770" y2="450" stroke="#38b2ac" stroke-width="2"/>

  <!-- Threat caption -->
  <text x="40" y="606" fill="#66757f" font-size="12">Threat to guard against: OWASP Agentic AI ASI03 — Identity &amp; Privilege Abuse. Defenses: least privilege · dual control · audit chain · anomaly detection.</text>
</svg>
